name: Mixed Family Native Lab

on:
  push:
    branches:
      - feat/native-mixed-families-v1955

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect mixed-family donor pools
        run: node tools/probe-mixed-family-donors.cjs
