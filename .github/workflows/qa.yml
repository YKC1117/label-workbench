name: Label Workbench QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          for f in assets/*.js; do node --check "$f"; done
          node --check tests/btw-object-map-smoke.cjs
          node --check tests/btw-barcode-read-slot-smoke.cjs
          node --check tests/btw-caption-adapter-smoke.cjs
          node --check tests/analysis-geometry-smoke.cjs
          node --check tests/btw-layout-map-smoke.cjs
          node --check tests/btw-native-smoke.cjs
          node --check tests/btw-rich-native-smoke.cjs
          node --check tests/btw-production-gate-smoke.cjs
          node --check tests/analysis-copy-smoke.cjs
      - name: Current wiring sanity check
        run: |
          grep -q 'assets/barcode-reader.js?v=20260912-v360' index.html
          grep -q '標籤製作工作台 · v1.9.34' index.html
          grep -q '更新：2026/09/12 00:08' index.html
          grep -q "RELEASE='v1.9.34'" assets/view-state-guard.js
          grep -q "UPDATED='2026/09/12 00:08'" assets/view-state-guard.js
          grep -q "BUILD='20260912-view-guard-119-btw-datasource'" assets/view-state-guard.js
          grep -q "BUILD='20260912-v355-btw-datasource'" assets/barcode-reader.js
          grep -q "BUILD='20260912-btw-object-map-038-barcode-slot-mode'" assets/btw-object-map.js
          grep -q "BUILD='20260912-btw-caption-adapter-100'" assets/btw-caption-adapter.js
          grep -q "SEED_ID='CEA-2022-R5'" assets/btw-native.js
          grep -q "SEED_FUNCTION='btw-seed'" assets/btw-native.js
          grep -q 'btw-rich-native.js' assets/barcode-reader.js
          grep -q 'btw-production-gate.js' assets/barcode-reader.js
      - name: Core logic smoke tests
        run: node tests/logic-smoke.cjs
      - name: Cloud merge smoke tests
        run: node tests/cloud-smoke.cjs
      - name: Attachment helper smoke tests
        run: node tests/attachment-smoke.cjs
      - name: Document parser helper smoke tests
        run: node tests/parser-smoke.cjs
      - name: Image barcode reader helper smoke tests
        run: node tests/barcode-reader-smoke.cjs
      - name: Quick analysis boundary accuracy regression tests
        run: node tests/analysis-accuracy-smoke.cjs
      - name: Quick Analysis copy-button regression tests
        run: node tests/analysis-copy-smoke.cjs
      - name: Source geometry matching smoke tests
        run: node tests/analysis-geometry-smoke.cjs
      - name: Source geometry to BTW coordinate mapping tests
        run: node tests/btw-layout-map-smoke.cjs
      - name: Barcode generator and production-analysis smoke tests
        run: node tests/v15-smoke.cjs
      - name: BT optional table-pack and safe launch smoke tests
        run: node tests/bt-launch-smoke.cjs
      - name: BTW seed structure diagnostic
        run: node tests/btw-seed-diagnostic.cjs
      - name: Official rich donor independent Text-object round trip
        run: node tests/rich-donor-edit-smoke.cjs
      - name: Official rich donor independent barcode round trip
        run: node tests/rich-donor-barcode-smoke.cjs
      - name: Official rich donor visible object-pool diagnostic
        run: node tests/rich-donor-pool-smoke.cjs
      - name: Official rich donor full sanitization gate
        run: node tests/rich-donor-sanitize-smoke.cjs
      - name: Native BTW object decoder/editor smoke tests
        run: node tests/btw-object-map-smoke.cjs
      - name: Real BTW barcode read-slot regression tests
        run: node tests/btw-barcode-read-slot-smoke.cjs
      - name: Independent BTW field-caption adapter smoke tests
        run: node tests/btw-caption-adapter-smoke.cjs
      - name: CEA seed native object map diagnostic
        run: node tests/cea-object-map-diagnostic.cjs
      - name: Native editable BTW generation smoke tests
        run: node tests/btw-native-smoke.cjs
      - name: Production rich native BTW generation smoke tests
        run: node tests/btw-rich-native-smoke.cjs
      - name: BTW pending-field production safety gate
        run: node tests/btw-production-gate-smoke.cjs
