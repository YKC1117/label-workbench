name: Label Workbench QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: |
          node --check assets/app.js
          node --check assets/cloud.js
          node --check assets/cloud-config.js
          node --check assets/cloud-attachments.js
          node --check assets/file-parsers.js
          node --check assets/barcode-reader.js
          node --check assets/barcode-reader-core.js
          node --check assets/barcode-reader-ui.js
          node --check assets/barcode-generator.js
          node --check assets/label-interpreter.js
          node --check assets/analysis-accuracy.js
          node --check assets/analysis-pdf-native.js
          node --check assets/analysis-field-consistency.js
          node --check assets/analysis-copy.js
          node --check assets/analysis-confidence-guard.js
          node --check assets/analysis-final-display.js
          node --check assets/view-state-guard.js
          node --check assets/bt-quick.js
          node --check assets/btw-format.js
          node --check assets/btw-native.js
          node --check assets/bt-direct-import.js
          node --check assets/bt-bridge.js
          node --check assets/bt-native-primary.js
          node --check assets/layout-shortcuts.js
          node --check assets/workbench-priority.js
          node --check tests/btw-seed-diagnostic.cjs

      - name: Current wiring sanity check
        run: |
          grep -q 'assets/barcode-reader.js?v=' index.html
          grep -q '標籤製作工作台 · v1.9.25' index.html
          grep -q 'view-state-guard.js' assets/barcode-reader.js
          grep -q 'bt-native-primary.js' assets/barcode-reader.js
          grep -q 'analysis-confidence-guard.js' assets/barcode-reader.js
          grep -q 'downloadFromAnalysis' assets/btw-native.js
          grep -q 'downloadEditable' assets/bt-native-primary.js

      - name: Core logic smoke tests
        run: node tests/logic-smoke.cjs

      - name: Cloud merge smoke tests
        run: node tests/cloud-smoke.cjs

      - name: Attachment helper smoke tests
        run: node tests/attachment-smoke.cjs

      - name: Document parser helper smoke tests
        run: node tests/parser-smoke.cjs

      - name: Image barcode reader helper smoke tests
        run: node tests/barcode-reader-smoke.cjs

      - name: Quick analysis boundary accuracy regression tests
        run: node tests/analysis-accuracy-smoke.cjs

      - name: Barcode generator and production-analysis smoke tests
        run: node tests/v15-smoke.cjs

      - name: BT optional table-pack and safe launch smoke tests
        run: node tests/bt-launch-smoke.cjs

      - name: BTW seed structure diagnostic
        run: node tests/btw-seed-diagnostic.cjs

      - name: Native editable BTW generation smoke tests
        run: node tests/btw-native-smoke.cjs
