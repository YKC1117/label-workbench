name: Label Workbench QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          for f in assets/*.js; do node --check "$f"; done
          node --check tests/btw-object-map-smoke.cjs
          node --check tests/btw-barcode-read-slot-smoke.cjs
          node --check tests/btw-caption-adapter-smoke.cjs
          node --check tests/analysis-geometry-smoke.cjs
          node --check tests/btw-layout-map-smoke.cjs
          node --check tests/btw-native-smoke.cjs
          node --check tests/btw-family-native-smoke.cjs
          node --check tests/btw-rich-native-smoke.cjs
          node --check tests/btw-production-gate-smoke.cjs
          node --check tests/btw-production-core-smoke.cjs
          node --check tests/browser-btw-flow-smoke.cjs
          node --check tests/analysis-copy-smoke.cjs
          node --check tests/analysis-entry-smoke.cjs
          node --check tests/analysis-entry-readiness-smoke.cjs
          node --check tests/ocr-fallback-quality-smoke.cjs
          node --check tests/btw-seed-retry-smoke.cjs
          node --check tests/analysis-core-v2-smoke.cjs
          node --check tests/generic-label-model-smoke.cjs
          node --check tests/generic-textobjects-btw-smoke.cjs
          node --check tests/analysis-to-btw-e2e-smoke.cjs
          node --check tests/analysis-barcode-crosscheck-smoke.cjs
          node --check tests/second-donor-pool-smoke.cjs
          node --check tests/second-donor-generation-smoke.cjs
          node --check tools/create-btw-runtime-fixture.cjs
          node --check tools/verify-btw-runtime-fixture.cjs
          node --check tools/verify-btw-manual-edit.cjs
          node --check tests/runtime-fixture-smoke.cjs
          node --check tests/manual-edit-verifier-smoke.cjs
      - name: PowerShell runtime verifier syntax check
        shell: pwsh
        run: |
          foreach ($f in @('tools/verify-btw-runtime.ps1','tools/verify-btw-runtime-suite.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Windows acceptance launcher wiring check
        run: |
          grep -q 'verify-btw-runtime-suite.ps1' RUN_BARTENDER_2022_ACCEPTANCE.cmd
          grep -q 'runtime-acceptance-report.json' RUN_BARTENDER_2022_ACCEPTANCE.cmd
          grep -q 'where node' RUN_BARTENDER_2022_ACCEPTANCE.cmd
          grep -q 'verify-btw-manual-edit.cjs' RUN_BARTENDER_2022_MANUAL_EDIT_VERIFY.cmd
          grep -q 'LabelWorkbench_Runtime_Acceptance_EDITED.btw' RUN_BARTENDER_2022_MANUAL_EDIT_VERIFY.cmd
      - name: Current wiring sanity check
        run: |
          grep -q 'assets/analysis-entry.js?v=20260918-v147' index.html
          grep -q 'assets/barcode-reader.js?v=20260918-v387' index.html
          grep -q '標籤製作工作台 · v1.9.50' index.html
          grep -q '更新：2026/09/18 10:59' index.html
          grep -q 'assets/analysis-race-guard.js?v=20260914-v139' index.html
          grep -q "BUILD='20260918-analysis-entry-147-core-ready'" assets/analysis-entry.js
          grep -q "dataset.priorityBound='true'" assets/analysis-entry.js
          grep -q "BUILD='20260918-view-guard-145-index-owned-version'" assets/view-state-guard.js
          ! grep -q "marker.innerHTML='標籤製作工作台" assets/view-state-guard.js
          grep -q "BUILD='20260918-v387-native-barcode-families'" assets/barcode-reader.js
          grep -q "BUILD='20260918-v183-quality-fallback'" assets/label-interpreter.js
          grep -q "BUILD='20260918-btw-production-gate-110-textobjects'" assets/btw-production-gate.js
          grep -q "BUILD='20260918-btw-second-native-110-textobjects'" assets/btw-second-native.js
          grep -q 'analysis-core-v2.js' assets/barcode-reader.js
          grep -q "BUILD='20260918-analysis-core-v2-200'" assets/analysis-core-v2.js
          grep -q 'LabelWorkbenchModuleLoader={BUILD,ready:true}' assets/barcode-reader.js
          grep -q "BUILD='20260918-barcode-crosscheck-108-clear-stale-ocr'" assets/analysis-barcode-crosscheck.js
          grep -q "analysis-barcode-crosscheck.js'" assets/barcode-reader.js
          grep -q "BUILD='20260918-btw-object-map-043-textcontrol-numeric'" assets/btw-object-map.js
          grep -q "BUILD='20260912-btw-caption-adapter-100'" assets/btw-caption-adapter.js
          grep -q "SEED_ID='CEA-2022-R5'" assets/btw-native.js
          grep -q "SEED_FUNCTION='btw-seed'" assets/btw-native.js\n          grep -q "BUILD='20260918-btwn232-seed-retry'" assets/btw-native.js
          grep -q 'btw-rich-native.js' assets/barcode-reader.js
          grep -q 'btw-second-donor.js' assets/barcode-reader.js
          grep -q 'btw-second-native.js' assets/barcode-reader.js
          grep -q "SEED_ID='LW-SECOND-SANITIZED-2022-R2'" assets/btw-second-native.js
          grep -q "MAX_C128=5" assets/btw-second-native.js
          grep -q "MAX_DM=1" assets/btw-second-native.js
          grep -q 'btw-production-gate.js' assets/barcode-reader.js
          grep -q 'btw-family-native.js' assets/barcode-reader.js
          grep -q "BUILD='20260918-btw-family-native-100-qr-c39'" assets/btw-family-native.js
          grep -q 'btw-production-core.js' assets/barcode-reader.js
          grep -q "BUILD='20260918-btw-production-core-110-family-first'" assets/btw-production-core.js
          grep -q "BUILD='20260918-btnp230-website-only-ux'" assets/bt-native-primary.js
          grep -q "ensureProduction" assets/bt-native-primary.js
          grep -q "await ensureProduction()" assets/bt-native-primary.js
          grep -q '不用另外安裝網站工具' index.html
          grep -q '唯一需要下載的是最後的 <code>.btw</code> 成品' assets/bt-native-primary.js
          grep -q "BUILD='20260914-v139-race-guard'" assets/analysis-race-guard.js
          grep -q "BUILD='20260914-v139-race-safe-display'" assets/analysis-final-display.js
          grep -q "BUILD='20260918-v145-await-dom-no-version-write'" assets/analysis-confidence-guard.js
          ! grep -q "brand.innerHTML='標籤製作工作台" assets/analysis-confidence-guard.js
          ! grep -q 'setTimeout(()=>patchDom(result),120)' assets/analysis-confidence-guard.js
      - name: Core logic smoke tests
        run: node tests/logic-smoke.cjs
      - name: Cloud merge smoke tests
        run: node tests/cloud-smoke.cjs
      - name: Attachment helper smoke tests
        run: node tests/attachment-smoke.cjs
      - name: Document parser helper smoke tests
        run: node tests/parser-smoke.cjs
      - name: Image barcode reader helper smoke tests
        run: node tests/barcode-reader-smoke.cjs
      - name: Quick analysis boundary accuracy regression tests
        run: node tests/analysis-accuracy-smoke.cjs
      - name: Quick Analysis copy-button regression tests
        run: node tests/analysis-copy-smoke.cjs
      - name: Quick Analysis early file-selection regression tests
        run: node tests/analysis-entry-smoke.cjs
      - name: Quick Analysis loader readiness routing
        run: node tests/analysis-entry-readiness-smoke.cjs
      - name: OCR quality-driven fallback gate
        run: node tests/ocr-fallback-quality-smoke.cjs
      - name: BTW seed transient retry recovery
        run: node tests/btw-seed-retry-smoke.cjs
      - name: Deterministic Quick Analysis core v2 regression tests
        run: node tests/analysis-core-v2-smoke.cjs
      - name: Arbitrary-customer generic label object model
        run: node tests/generic-label-model-smoke.cjs
      - name: Arbitrary-customer textObjects to editable BTW round trip
        run: node tests/generic-textobjects-btw-smoke.cjs
      - name: Analysis to BarTender BTW end-to-end integrity gate
        run: node tests/analysis-to-btw-e2e-smoke.cjs
      - name: Barcode cross-check regression tests
        run: node tests/analysis-barcode-crosscheck-smoke.cjs
      - name: Source geometry matching smoke tests
        run: node tests/analysis-geometry-smoke.cjs
      - name: Source geometry to BTW coordinate mapping tests
        run: node tests/btw-layout-map-smoke.cjs
      - name: Barcode generator and production-analysis smoke tests
        run: node tests/v15-smoke.cjs
      - name: BT optional table-pack and safe launch smoke tests
        run: node tests/bt-launch-smoke.cjs
      - name: BTW seed structure diagnostic
        run: node tests/btw-seed-diagnostic.cjs
      - name: Official rich donor independent Text-object round trip
        run: node tests/rich-donor-edit-smoke.cjs
      - name: Official rich donor independent barcode round trip
        run: node tests/rich-donor-barcode-smoke.cjs
      - name: Official rich donor visible object-pool diagnostic
        run: node tests/rich-donor-pool-smoke.cjs
      - name: Official rich donor full sanitization gate
        run: node tests/rich-donor-sanitize-smoke.cjs
      - name: Sanitized 5C128+1DM donor object-pool gate
        run: node tests/second-donor-pool-smoke.cjs
      - name: Sanitized 5C128+1DM native generation round trip
        run: node tests/second-donor-generation-smoke.cjs
      - name: Deterministic BarTender runtime acceptance fixture
        run: node tests/runtime-fixture-smoke.cjs
      - name: Manual BarTender Designer edit verifier regression
        run: node tests/manual-edit-verifier-smoke.cjs
      - name: Build portable BarTender runtime acceptance pack
        run: |
          mkdir -p artifacts/runtime-acceptance/assets artifacts/runtime-acceptance/tools
          node tools/create-btw-runtime-fixture.cjs artifacts/runtime-acceptance/LabelWorkbench_Runtime_Acceptance.btw
          node tools/verify-btw-runtime-fixture.cjs artifacts/runtime-acceptance/LabelWorkbench_Runtime_Acceptance.btw
          cp docs/btw-runtime-acceptance.md artifacts/runtime-acceptance/README.md
          cp RUN_BARTENDER_2022_ACCEPTANCE.cmd artifacts/runtime-acceptance/
          cp RUN_BARTENDER_2022_MANUAL_EDIT_VERIFY.cmd artifacts/runtime-acceptance/
          cp tools/create-btw-runtime-fixture.cjs artifacts/runtime-acceptance/tools/
          cp tools/verify-btw-runtime-fixture.cjs artifacts/runtime-acceptance/tools/
          cp tools/verify-btw-manual-edit.cjs artifacts/runtime-acceptance/tools/
          cp tools/verify-btw-runtime.ps1 artifacts/runtime-acceptance/tools/
          cp tools/verify-btw-runtime-suite.ps1 artifacts/runtime-acceptance/tools/
          cp assets/btw-format.js artifacts/runtime-acceptance/assets/
          cp assets/btw-object-map.js artifacts/runtime-acceptance/assets/
          cp assets/btw-layout-map.js artifacts/runtime-acceptance/assets/
          cp assets/btw-second-donor.js artifacts/runtime-acceptance/assets/
          cp assets/btw-second-native.js artifacts/runtime-acceptance/assets/
          (
            cd artifacts/runtime-acceptance
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
      - name: Verify portable acceptance pack layout
        run: |
          test -s artifacts/runtime-acceptance/LabelWorkbench_Runtime_Acceptance.btw
          test -s artifacts/runtime-acceptance/RUN_BARTENDER_2022_ACCEPTANCE.cmd
          test -s artifacts/runtime-acceptance/RUN_BARTENDER_2022_MANUAL_EDIT_VERIFY.cmd
          test -s artifacts/runtime-acceptance/tools/verify-btw-runtime-suite.ps1
          test -s artifacts/runtime-acceptance/tools/verify-btw-runtime-fixture.cjs
          test -s artifacts/runtime-acceptance/tools/verify-btw-manual-edit.cjs
          test -s artifacts/runtime-acceptance/assets/btw-second-donor.js
          test -s artifacts/runtime-acceptance/SHA256SUMS.txt
      - name: Upload BarTender runtime acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: bartender-2022-runtime-acceptance
          path: artifacts/runtime-acceptance/
          if-no-files-found: error
          retention-days: 14
      - name: Native BTW object decoder/editor smoke tests
        run: node tests/btw-object-map-smoke.cjs
      - name: Native QR and Code39 donor round trip
        run: node tests/btw-family-native-smoke.cjs
      - name: Real BTW barcode read-slot regression tests
        run: node tests/btw-barcode-read-slot-smoke.cjs
      - name: Independent BTW field-caption adapter smoke tests
        run: node tests/btw-caption-adapter-smoke.cjs
      - name: CEA seed native object map diagnostic
        run: node tests/cea-object-map-diagnostic.cjs
      - name: Native editable BTW generation smoke tests
        run: node tests/btw-native-smoke.cjs
      - name: Production rich native BTW generation smoke tests
        run: node tests/btw-rich-native-smoke.cjs
      - name: Browser one-click editable BTW flow
        run: node tests/browser-btw-flow-smoke.cjs
      - name: Deterministic BTW production routing gate
        run: node tests/btw-production-core-smoke.cjs
      - name: BTW pending-field production safety gate
        run: node tests/btw-production-gate-smoke.cjs
