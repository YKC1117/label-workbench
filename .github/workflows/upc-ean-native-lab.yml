name: UPC EAN Native Lab

on:
  push:
    branches:
      - feat/native-upc-ean-v1952

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Family generator syntax check
        run: node --check assets/btw-family-native.js
      - name: Probe UPC-A and EAN-13 native datasources
        run: node tools/probe-upca-ean.cjs
      - name: Verify native QR Code39 UPC-A family generator
        run: node tests/btw-family-native-smoke.cjs
