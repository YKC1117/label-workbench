name: Label Workbench Production E2E

on:
  workflow_run:
    workflows: ["Label Workbench QA"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: read

jobs:
  production-browser-e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main QA commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Wait for matching GitHub Pages deployment success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          success=0
          for i in $(seq 1 40); do
            deployments="$(curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments?sha=$TARGET_SHA&environment=github-pages&per_page=10")"
            deployment_id="$(printf '%s' "$deployments" | jq -r '.[0].id // empty')"
            if [ -n "$deployment_id" ]; then
              state="$(curl -fsSL                 -H "Accept: application/vnd.github+json"                 -H "Authorization: Bearer $GH_TOKEN"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=20"                 | jq -r '.[0].state // empty')"
              echo "Pages deployment $deployment_id state: $state"
              if [ "$state" = "success" ]; then success=1; break; fi
              if [ "$state" = "error" ] || [ "$state" = "failure" ]; then
                echo "Matching GitHub Pages deployment failed."
                exit 1
              fi
            else
              echo "Matching github-pages deployment not created yet."
            fi
            sleep 15
          done
          test "$success" -eq 1

      - name: Wait for exact deployed version at subpath
        run: |
          set -euo pipefail
          expected="$(grep -o '標籤製作工作台 · v[0-9][0-9.]*' index.html | head -n1)"
          test -n "$expected"
          ready=0
          for i in $(seq 1 20); do
            page="$(curl -fsSL --cache-control no-cache "https://ykc1117.github.io/label-workbench/?qa=${{ github.event.workflow_run.head_sha }}" || true)"
            if printf '%s' "$page" | grep -Fq "$expected"; then
              ready=1
              echo "Production is serving: $expected"
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Production /label-workbench/ PDF PNG JPG analysis and direct BTW download
        env:
          E2E_BASE_URL: https://ykc1117.github.io
          E2E_APP_PATH: /label-workbench/
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-e2e-evidence
          path: |
            artifacts/browser/
            test-results/
          retention-days: 14
